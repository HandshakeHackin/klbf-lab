name: Draw mixed targets through the mesh and graphics paths
on:
  push:
    branches: [verify/issue-55-mesh-draw]
permissions:
  contents: read
jobs:
  draw-and-read:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Include the fork-only pixel readback fixture
        shell: pwsh
        run: |
          $file = "crates/victory-gpu/src/pipeline/host.rs"
          Copy-Item tests/integer_blend_pixels.rs crates/victory-gpu/src/pipeline/integer_blend_pixels.rs
          $src = [IO.File]::ReadAllText((Resolve-Path $file))
          $needle = "mod tests {"
          if (($src.Split($needle).Count -ne 2)) { throw "Missing or ambiguous test module" }
          [IO.File]::WriteAllText((Resolve-Path $file), $src.Replace($needle, $needle + [Environment]::NewLine + '    include!("integer_blend_pixels.rs");'))
      - name: Draw and compare all 16 pixels in every target for both blend modes
        env:
          VICTORY_D3D12_WARP: '1'
        run: cargo test --locked -p victory-gpu --features diagnostics --lib corrected_integer_targets_render_mesh_and_graphics_pixels -- --nocapture
