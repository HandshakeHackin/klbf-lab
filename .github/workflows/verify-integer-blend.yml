name: Writable integer targets on Windows
on:
  push:
    branches: [verify/writable-integer-target-blend]
permissions:
  contents: read
jobs:
  mixed-render-targets:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b88dfcde6150d7e6c8a09136f6a177cce448b94f
          persist-credentials: false
      - name: Exercise mixed-target blending on native Windows WARP
        run: cargo test --locked -p victory-gpu --lib integer_blend_ -- --include-ignored --nocapture
      - name: Build the Windows beta test executable
        run: cargo build --locked --release -p victory
      - name: Smoke-test the executable and record its checksum
        shell: pwsh
        run: |
          ./target/release/victory.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $h = (Get-FileHash -Algorithm SHA256 target/release/victory.exe).Hash.ToLowerInvariant()
          "$h  victory.exe" | Out-File -Encoding ascii target/release/SHA256SUMS.txt
          Get-Content target/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: victory-beta-integer-blend-windows-x64
          path: |
            target/release/victory.exe
            target/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
