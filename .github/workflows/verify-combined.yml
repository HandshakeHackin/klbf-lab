name: Combined Radeon diagnostic build
on:
  push:
    branches: [verify/pr127-combined-diag]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test exact aperture selection
        run: cargo test -p victory-gpu --locked --features diagnostics --lib fullest_aperture
      - name: Compile the diagnostic configuration
        run: cargo build --profile diag -p victory --features diagnostics --locked
