name: Verify PR 133 with depth fix

on:
  push:
    branches:
      - verify/pr133-depth-bounds
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pr133-depth-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Portable PE tests
        run: cargo test -p victory-pe --locked
      - name: Portable PE strict Clippy
        run: cargo clippy -p victory-pe --all-targets --locked -- -D warnings
      - name: Depth-bounds WARP regression
        run: cargo test -p victory-gpu pipeline::host::tests::depth_bounds_pipeline_loads_and_filters_draws --locked -- --exact --nocapture
