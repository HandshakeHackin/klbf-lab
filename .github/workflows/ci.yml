name: Reproduce the three unchanged release GPU failures
on:
  push:
    branches: ['verify/v26.11.5-gpu-ci-baseline']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Compare unmodified v26.11.5 tests, then measure and exercise larger BC1 fixtures
        shell: pwsh
        run: ./tests/verify-release-gpu-baseline.ps1
