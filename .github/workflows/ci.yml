name: Verify launcher preparation failure diagnostics
on:
  push:
    branches: ['verify/preparation-diagnostic-windows']
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: baseline
          ref: 6d4f3ef53f46eb2f6dfa8108fc2658bd7646c088
      - name: Check v26.11.5 with the same child processes
        shell: powershell
        run: |
          Copy-Item ./tests/preparation-exit-log.ps1 ./baseline/tests/
          ./baseline/tests/preparation-exit-log.ps1 -ExpectOriginal
      - name: Check process IDs, exit status and progress after the patch
        shell: powershell
        run: |
          ./tests/preparation-exit-log.ps1
      - name: Run existing launcher log checks
        shell: powershell
        run: |
          $shellPath = (Get-Process -Id $PID).Path
          & $shellPath -NoProfile -File ./tests/launcher-logs.ps1
          exit $LASTEXITCODE
  pwsh:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: baseline
          ref: 6d4f3ef53f46eb2f6dfa8108fc2658bd7646c088
      - name: Check v26.11.5 with the same child processes
        shell: pwsh
        run: |
          Copy-Item ./tests/preparation-exit-log.ps1 ./baseline/tests/
          ./baseline/tests/preparation-exit-log.ps1 -ExpectOriginal
      - name: Check process IDs, exit status and progress after the patch
        shell: pwsh
        run: |
          ./tests/preparation-exit-log.ps1
      - name: Run existing launcher log checks
        shell: pwsh
        run: |
          $shellPath = (Get-Process -Id $PID).Path
          & $shellPath -NoProfile -File ./tests/launcher-logs.ps1
          exit $LASTEXITCODE
