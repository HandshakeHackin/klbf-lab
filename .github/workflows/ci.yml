          foreach ($package in $packages) {
              $zip = Join-Path $env:RUNNER_TEMP $package.Name
              Invoke-WebRequest ("https://github.com/PastiiJay/klbf-lab/releases/download/v26.11.6/" + $package.Name) -OutFile $zip
              $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
              if ($actual -ne $package.Sha256) { throw "Unexpected fingerprint for $($package.Name): $actual" }
              Write-Host "$($package.Name) SHA-256 $actual"
              Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP $package.Dir)
