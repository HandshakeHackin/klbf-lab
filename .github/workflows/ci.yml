name: Release-based Radeon regression tests
on:
  push:
    branches: ['verify/stable-amd-pr9-windows']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ff665018643cb3624c00d50a4e59251f94409085
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run GPU memory segment regression tests
        run: cargo test --locked -p victory-gpu --lib host::segments::tests
      - name: Build diagnostics
        run: cargo build --locked --profile diag -p victory --features diagnostics
