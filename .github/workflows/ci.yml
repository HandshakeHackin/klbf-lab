            $ok = $argv.Count -eq 6 -and $argv[0] -eq 'v-test' -and $argv[1] -eq 'C:\build folder\artifact.zip' -and $argv[2] -eq '--title' -and $argv[3] -eq 'KLBF Lab v-test' -and $argv[4] -eq '--notes' -and $argv[5] -like '*KLBF Lab.cmd*abcd'
            Write-Host "$rev argument count $($argv.Count), expected layout matched $ok"
