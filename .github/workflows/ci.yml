name: Benchmark result clipboard
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v5
      - name: Exercise benchmark clipboard on the Quick tab
        shell: ${{ matrix.shell }}
        run: |
          $exe = (Get-Process -Id $PID).Path
          & $exe -NoProfile -STA -File ./tests/benchmark-clipboard.ps1
          exit $LASTEXITCODE
