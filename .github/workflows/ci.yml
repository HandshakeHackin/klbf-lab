name: Verify settings on short displays
on:
  push:
    branches: ['verify/settings-display-switch']
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: baseline
          ref: 6d4f3ef53f46eb2f6dfa8108fc2658bd7646c088
      - name: Reproduce clipped Play on the release
        shell: powershell
        run: |
          Copy-Item ./tests/settings-work-area.ps1 ./baseline/tests/
          $exe = (Get-Process -Id $PID).Path
          & $exe -NoProfile -STA -File ./baseline/tests/settings-work-area.ps1 -ExpectOriginal
          exit $LASTEXITCODE
      - name: Exercise short work areas on the fix
        shell: powershell
        run: |
          $exe = (Get-Process -Id $PID).Path
          & $exe -NoProfile -STA -File ./tests/settings-work-area.ps1
          exit $LASTEXITCODE
  pwsh:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: baseline
          ref: 6d4f3ef53f46eb2f6dfa8108fc2658bd7646c088
      - name: Reproduce clipped Play on the release
        shell: pwsh
        run: |
          Copy-Item ./tests/settings-work-area.ps1 ./baseline/tests/
          $exe = (Get-Process -Id $PID).Path
          & $exe -NoProfile -STA -File ./baseline/tests/settings-work-area.ps1 -ExpectOriginal
          exit $LASTEXITCODE
      - name: Exercise short work areas on the fix
        shell: pwsh
        run: |
          $exe = (Get-Process -Id $PID).Path
          & $exe -NoProfile -STA -File ./tests/settings-work-area.ps1
          exit $LASTEXITCODE
