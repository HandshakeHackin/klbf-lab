name: Verify PR 118 full beta-2 port
on:
  push:
    branches: [verify/pr118-full-beta2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-shader:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Shader tests
        run: cargo test -p victory-shader --lib --locked
      - name: Shader clippy
        run: cargo clippy -p victory-shader --all-targets --locked -- -D warnings
