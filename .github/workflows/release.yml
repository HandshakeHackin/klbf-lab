name: Release

# A v* tag pushed: the players' zip (only our own files, scripts/package-release.ps1) built and published as
# that tag's release. Run by hand: the same zip, kept as a workflow artifact; it is published only when the
# run is started on a tag (ref_type tag), never from a branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - name: Build
        # The build every version is measured and certified with (nuit/compiler-distant.sh PROFILE=diag):
        # the diag profile and the diagnostics feature (bench black-frame detection), play.ps1's -Build default.
        run: cargo build --profile diag --features diagnostics --locked -p victory -p klbf-start
      - name: Package
        id: pkg
        shell: pwsh
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: |
          $zip = ./scripts/package-release.ps1 -Tag $env:TAG -Victory target/diag/victory.exe -Out dist
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower())" >> $env:GITHUB_OUTPUT
          # KLBF-Lab.zip (files in a "KLBF Lab" folder, for people) beside the flat one (for the updater)
          "zip2=dist/KLBF-Lab.zip" >> $env:GITHUB_OUTPUT
          "sha2=$((Get-FileHash -Algorithm SHA256 -LiteralPath dist/KLBF-Lab.zip).Hash.ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klbf-lab-win64
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip2 }}
          compression-level: 0
      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release starts as a pre-release, never "Latest": the launcher's update check (/releases/latest)
          # offers it to no one until it is promoted by hand (gh release edit <tag> --prerelease=false --latest).
          # (v26.11.4) The notes from a file: escaped quotes inside --notes split under pwsh (v26.11.3's publish
          # failed). The updater reads the first "SHA-256 of the zip: <hash>": it stays the flat zip's.
          $notes = @(
            'Download KLBF-Lab.zip, extract it, open the "KLBF Lab" folder, double-click "KLBF Lab", choose your own game folder. No game files are included.'
            ''
            '### Check your download'
            'Two zips, two different fingerprints (SHA-256). Compare the one **you downloaded**:'
            ''
            '| File | For | SHA-256 |'
            '|---|---|---|'
            '| `KLBF-Lab.zip` | people (files in a "KLBF Lab" folder) | `${{ steps.pkg.outputs.sha2 }}` |'
            '| `KLBF-Lab-win64.zip` | the automatic update (same files, no folder) | `${{ steps.pkg.outputs.sha }}` |'
            ''
            'In PowerShell, in the folder of the zip: `Get-FileHash .\KLBF-Lab.zip -Algorithm SHA256`. Already extracted? `SHA256SUMS.txt` inside lists every file: [docs/klbf/VERIFY.md](https://github.com/PastiiJay/klbf-lab/blob/main/docs/klbf/VERIFY.md) (also how to build it yourself).'
            ''
            'SHA-256 of the zip: ${{ steps.pkg.outputs.sha }} (KLBF-Lab-win64.zip: the line the automatic update reads, keep it as is)'
          ) -join "`n"
          Set-Content -LiteralPath notes.md -Value $notes -Encoding utf8NoBOM
          gh release create "${{ github.ref_name }}" "${{ steps.pkg.outputs.zip2 }}" "${{ steps.pkg.outputs.zip }}" --prerelease --latest=false --title "KLBF Lab ${{ github.ref_name }}" --notes-file notes.md
