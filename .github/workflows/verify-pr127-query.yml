name: Verify PR127 incomplete segment sample

on:
  push:
    branches: [fix/pr127-retain-tight-query-failure]

permissions:
  contents: read

jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - name: Compile and run aperture segment regressions
        run: cargo test -p victory-gpu --all-features --locked host::segments::tests -- --nocapture
