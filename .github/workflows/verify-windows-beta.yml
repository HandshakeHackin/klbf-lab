name: Verify ten beta PRs with upstream main's WARP-only test fix
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: 78ad5711ecaa7c8cbe5996f74c9d47d16167c061
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble the same ten PR heads reviewed locally
        shell: python
        run: |
          import subprocess
          prs = [13, 14, 17, 18, 20, 21, 25, 27, 49, 60]
          refs = [f"refs/pull/{n}/head:refs/verify/{n}" for n in prs]
          subprocess.run(["git", "fetch", "--no-tags", "origin", *refs], check=True)
          merge = ["git", "-c", "user.name=Verification", "-c", "user.email=ci@localhost", "merge", "--no-edit"]
          subprocess.run(merge + [f"refs/verify/{n}" for n in prs], check=True)
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          print("Combined tree", tree)
          assert tree == "89cdda44d4f1235e6cae576273b7d792fc0acd64"
          subprocess.run(["git", "diff", "--check", "78ad571", "HEAD"], check=True)
      - name: Apply the maintainer's software-only test condition from main
        run: git cherry-pick --no-commit 448b737fa8f4e669c3a9cede26c08a04d4cacd96
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo xtask policy
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: cargo test --locked -p victory-gpu --features diagnostics --lib pipeline::make::tests -- --test-threads=1
