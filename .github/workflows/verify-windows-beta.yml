name: Verify selected adapter logging on Windows
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  verify-adapter:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 88ea55a93d5616f6adbd14424c00e92fc5c4ecfd
          persist-credentials: false
      - name: Exercise D3D12 startup with the Windows software adapter
        shell: pwsh
        env:
          VICTORY_D3D12_WARP: '1'
        run: |
          @'

          [dev-dependencies.tracing-subscriber]
          workspace = true
          '@ | Add-Content crates/victory-gpu/Cargo.toml
          @'

          #[cfg(test)]
          #[test]
          fn ci_warp_startup() {
              tracing_subscriber::fmt().with_ansi(false).init();
              assert!(create().is_ok(), "WARP failed to initialize");
          }
          '@ | Add-Content crates/victory-gpu/src/host.rs
          cargo test -p victory-gpu --lib --features diagnostics ci_warp_startup -- --nocapture 2>&1 | Tee-Object -Variable result
          if ($LASTEXITCODE -ne 0) { throw 'The WARP startup test failed' }
          $log = ($result | Out-String)
          if ($log -notmatch 'host D3D12 device ready[^\r\n]*adapter="[^"]+"') {
            throw 'The selected adapter was missing from the startup log'
          }
