name: Verify both strict Clippy checks on Windows
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  clippy:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 6190ae2353cdc9ccd62b952a4b86ec9d9aa27f44
          persist-credentials: false
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked -p victory-game
      - run: cargo test --locked -p victory-hle --lib page_lists_are_read_at_the_titles_submit
