name: Verify PR 37 with the merged guard-page fix
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          repository: HandshakeHackin/klbf-lab
          ref: 3a648ab5f9d0a1b47e3b85f00f980d1b44de5901
          fetch-depth: 0
          persist-credentials: false
      - name: Integrate the current win10-test base
        shell: bash
        run: |
          git fetch --no-tags https://github.com/PastiiJay/klbf-lab.git 23db69d35bd7c55517f95e3a967ad26832ac3b9a
          git -c user.name=CI -c user.email=ci@localhost merge --no-commit FETCH_HEAD
      - name: Run overlap, write-watch, and event log regressions with diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p victory-gpu --features diagnostics --lib predicted_clashes_match_the_slots_invalidated_by_a_write -- --nocapture | tee "$RUNNER_TEMP/overlap.log"
          grep -F '1 passed; 0 failed' "$RUNNER_TEMP/overlap.log"
          cargo test --locked -p victory-gpu --features diagnostics --lib watch::tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/watch.log"
          grep -F '14 passed; 0 failed' "$RUNNER_TEMP/watch.log"
      - name: Run all GPU library tests sequentially
        run: cargo test --locked -p victory-gpu --lib -- --test-threads=1
