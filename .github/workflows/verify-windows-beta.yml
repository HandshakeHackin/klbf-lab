name: Check the published Win10 test branch and Agility runtime
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  agility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: 338f7c527b5522f0bf0fa1cc1cb2047b43fef181
          persist-credentials: false
      - name: Build the unmodified Windows test candidate
        run: cargo build --release --locked -p victory
      - name: Inspect both exported constants in the release executable
        shell: pwsh
        run: |
          @'
          import struct
          import sys
          from pathlib import Path
          
          exe = Path(sys.argv[1]).read_bytes()
          u16 = lambda off: struct.unpack_from('<H', exe, off)[0]
          u32 = lambda off: struct.unpack_from('<I', exe, off)[0]
          u64 = lambda off: struct.unpack_from('<Q', exe, off)[0]
          pe = u32(0x3c)
          assert exe[pe:pe + 4] == b'PE\0\0' and u16(pe + 4) == 0x8664
          opt = pe + 24
          assert u16(opt) == 0x20b
          image_base = u64(opt + 24)
          first_section = opt + u16(pe + 20)
          sections = [first_section + i * 40 for i in range(u16(pe + 6))]
          
          def locate(rva):
              for s in sections:
                  virtual = u32(s + 12)
                  if virtual <= rva < virtual + u32(s + 16):
                      return u32(s + 20) + rva - virtual
              raise ValueError(f'RVA {rva:x} is outside the image sections')
          
          def string_at(rva):
              start = locate(rva)
              return exe[start:exe.index(0, start)].decode('ascii')
          
          exports = locate(u32(opt + 112))
          addresses = locate(u32(exports + 28))
          names = locate(u32(exports + 32))
          ordinals = locate(u32(exports + 36))
          locations = {}
          for i in range(u32(exports + 24)):
              name = string_at(u32(names + i * 4))
              rva = u32(addresses + u16(ordinals + i * 2) * 4)
              locations[name] = rva
          version = u32(locate(locations['D3D12SDKVersion']))
          path = string_at(u64(locate(locations['D3D12SDKPath'])) - image_base)
          print(f'Win64 victory.exe exports SDK version {version} and path {path!r}', flush=True)
          assert version == 614 and path == '.\\D3D12\\'
          '@ | python - target/release/victory.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage Microsoft's package as in issue 11
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.Direct3D.D3D12/1.614.1 -OutFile d3d12.zip
          Expand-Archive d3d12.zip d3d12pkg -Force
          New-Item -ItemType Directory -Force target/release/D3D12 | Out-Null
          Copy-Item d3d12pkg/build/native/bin/x64/D3D12Core.dll target/release/D3D12/
          $dll = Get-Item target/release/D3D12/D3D12Core.dll
          $dll.VersionInfo | Format-List FileVersion,ProductVersion
          Get-FileHash $dll.FullName
          Get-AuthenticodeSignature $dll.FullName | Select-Object Status, @{ Name='Signer'; Expression={$_.SignerCertificate.Subject} } | Format-List
      - name: Observe the real CLI creating a WARP device and record the loaded runtime
        shell: pwsh
        env:
          VICTORY_WARP: '1'
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'agility-empty-shader-inputs'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $bytes = [byte[]]::new(4096)
          for ($i=0; $i -lt 1600; $i++) { [IO.File]::WriteAllBytes((Join-Path $root "$i.bin"), $bytes) }
          $info = [Diagnostics.ProcessStartInfo]::new((Resolve-Path target/release/victory.exe))
          foreach ($arg in @('translate','--pipelines','--jobs','1',$root)) { $info.ArgumentList.Add($arg) }
          $info.UseShellExecute = $false
          $p = [Diagnostics.Process]::Start($info)
          $seen = @{}
          while (!$p.HasExited) {
            try {
              $p.Refresh()
              foreach ($m in $p.Modules) {
                if ($m.ModuleName -ieq 'D3D12Core.dll') { $seen[$m.FileName] = $m.FileVersionInfo.FileVersion }
              }
            } catch [System.InvalidOperationException] { break } catch [System.ComponentModel.Win32Exception] {}
            Start-Sleep -Milliseconds 5
          }
          $p.WaitForExit()
          Write-Host "Host OS $([Environment]::OSVersion.Version) / victory exit $($p.ExitCode)"
          foreach ($path in $seen.Keys) { Write-Host "Loaded D3D12Core: $path ($($seen[$path]))" }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (!$seen.Count) { throw 'Process ended before a module path was observed' }
