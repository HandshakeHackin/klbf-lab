name: Verify PR 43 queue and indirect toggles on WARP
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  toggles:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VICTORY_D3D12_WARP: "1"
      VICTORY_REQUIRE_HW_GPU: "1"
      VICTORY_D3D12_DEBUG: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: 4f71557e022bd4d06278bfdff18008fa33c511e6
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Exercise queue coalescing on and off
        run: |
          foreach ($toggle in @('0','1')) {
            $env:VICTORY_JOIN_PARTS = $toggle
            Write-Host "VICTORY_JOIN_PARTS=$toggle"
            cargo test --locked -p victory-gpu --features diagnostics --lib hw_coalesce_ready_parts_and_negative_controls -- --test-threads=1 --nocapture
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Read back the GPU output with gather on and off
        run: |
          foreach ($toggle in @('0','1')) {
            $env:VICTORY_INDIRECT_GATHER = $toggle
            Write-Host "VICTORY_INDIRECT_GATHER=$toggle"
            cargo test --locked -p victory-gpu --features diagnostics --lib hw_gather_hostlist_bound_before_end_to_end -- --test-threads=1 --nocapture
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
