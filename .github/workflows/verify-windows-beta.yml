name: Run the write-watch regression test under Wine
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 6f55eae05c4900b656ff5e723c7d685a3172ef3a
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the PR's Windows test executable
        shell: python
        run: |
          from pathlib import Path
          import json, shutil, subprocess
          command = ["cargo", "test", "--locked", "-p", "victory-gpu", "--lib", "--no-run", "--message-format=json"]
          result = subprocess.run(command, capture_output=True, text=True)
          print(result.stderr)
          result.check_returncode()
          messages = [json.loads(line) for line in result.stdout.splitlines()]
          binaries = [m["executable"] for m in messages if m.get("reason") == "compiler-artifact" and m.get("executable") and m["target"]["name"] == "victory_gpu" and m["profile"]["test"]]
          assert len(binaries) == 1, binaries
          shutil.copy2(binaries[0], "watch-test.exe")
      - uses: actions/upload-artifact@v4
        with:
          name: write-watch-test
          path: watch-test.exe
          retention-days: 1
  wine:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WINEARCH: win64
      WINEDEBUG: -all,err+module
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: write-watch-test
      - name: Install the distribution's 64-bit Wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine64 xvfb xauth
          /usr/lib/wine/wine64 --version
      - name: Run the unchanged test, then the watch group
        shell: bash
        run: |
          set -euo pipefail
          test=watch::tests::written_pages_are_reported_to_every_asker
          xvfb-run -a /usr/lib/wine/wine64 ./watch-test.exe "$test" --exact --test-threads=1 | tee /tmp/watch-focus.log
          grep -F "$test ... ok" /tmp/watch-focus.log
          xvfb-run -a /usr/lib/wine/wine64 ./watch-test.exe 'watch::tests::' --test-threads=1 | tee /tmp/watch-group.log
          grep -F '11 passed; 0 failed' /tmp/watch-group.log
