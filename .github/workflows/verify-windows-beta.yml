name: Compare PR 28's texture hashes across Rayon pool sizes
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  hashes:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: 39ad8490478fa205f8f88a74acd237a1e517f97a
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Record CPU model and visible logical processors
        run: Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
      - name: Compare the unmodified release benchmark in interleaved rounds
        shell: python
        run: |
          import os, re, statistics, subprocess
          from collections import defaultdict
          results = defaultdict(list)
          base = ["cargo", "test", "--release", "--locked", "-p", "victory-gpu", "--lib"]
          prefix = "texture::content_hash_tests::"
          def execute(case, workers, args):
              env = dict(os.environ)
              env.pop("RAYON_NUM_THREADS", None)
              if workers != "default":
                  env["RAYON_NUM_THREADS"] = workers
              cmd = base + [prefix + case, "--", "--exact", *args]
              result = subprocess.run(cmd, env=env, capture_output=True, text=True)
              if result.returncode or "1 passed; 0 failed" not in result.stdout:
                  raise RuntimeError(result.stdout + result.stderr)
              return result.stdout + result.stderr
          pools = ["1", "2", "default"]
          for pool in pools:
              execute("the_wide_hash_is_the_hash", pool, [])
          print("All three pool configurations passed all eleven byte-equality fixtures", flush=True)
          for round_no in range(6):
              for i in range(len(pools)):
                  pool = pools[(round_no + i) % len(pools)]
                  log = execute("content_hash_speed", pool, ["--ignored", "--nocapture"])
                  rows = re.findall(r"(\d+) MB: one thread [\d.]+ GB/s \(([\d.]+) ms\), content_hash [\d.]+ GB/s \(([\d.]+) ms\)", log)
                  assert len(rows) == 3, log
                  for size,serial,wide in rows:
                      print(f"round={round_no} pool={pool} MiB={size} serial_ms={serial} candidate_ms={wide}", flush=True)
                      results[(pool, int(size))].append((float(serial),float(wide)))
          for pool in pools:
              for size in (1,4,16):
                  serial,wide=zip(*results[(pool,size)])
                  print(f"MEDIAN pool={pool} MiB={size} serial_ms={statistics.median(serial):.3f} candidate_ms={statistics.median(wide):.3f}", flush=True)
