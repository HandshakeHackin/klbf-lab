name: Verify shader parity on WARP
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  parity:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: refs/pull/41/head
          persist-credentials: false
      - name: Check reviewed revision
        run: |
          if ((git rev-parse HEAD) -ne 'ba88ab0607c7cc1b7fa83b3c6f3a4a9beb1093be') { throw 'Pull request revision changed' }
      - run: rustup toolchain install
      - name: Require the SDK validator in the test harness
        shell: python
        run: |
          from pathlib import Path
          p = Path("crates/victory-shader/src/emit/bitcode/opt.rs")
          data = p.read_text(encoding="utf-8")
          optional = "if let Ok(mut v) = validator::Validator::load(validator::Validator::default_path().as_deref()) {"
          strict = '{ let mut v = validator::Validator::load(validator::Validator::default_path().as_deref()).expect("Windows SDK DXIL validator required");'
          assert data.count(optional) == 1
          p.write_text(data.replace(optional, strict), encoding="utf-8")
      - name: Compare optimized and unoptimized dispatches on WARP
        env:
          VICTORY_WARP: "1"
          VICTORY_REQUIRE_HW_GPU: "1"
          VICTORY_D3D12_DEBUG: "1"
        run: cargo test --locked -p victory-shader --lib dxil_opt_hw_gpu_bit_exact_parity_and_validation -- --nocapture --test-threads=1
