name: Verify multiline shader skip lists on Windows
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  parser:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cd84924911aa5c321c7d242452da719726f58a78
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Confirm the multiline fixture fails with the old delimiter
        shell: pwsh
        run: |
          $path = 'crates/victory-gpu/src/pipeline.rs'
          $current = [IO.File]::ReadAllText($path)
          $old = $current.Replace(".split([',', '\r', '\n'])", ".split(',')")
          if ($old -ceq $current) { throw 'delimiter substitution failed' }
          [IO.File]::WriteAllText($path, $old)
          cargo test --locked -p victory-gpu --lib pipeline::tests::skip_hashes_accepts_multiline_files -- --exact 2>&1 | Tee-Object "$env:RUNNER_TEMP/red.log"
          $rc = $LASTEXITCODE
          git restore -- $path
          if ($rc -ne 101 -or !(Select-String -Quiet -SimpleMatch 'test pipeline::tests::skip_hashes_accepts_multiline_files ... FAILED' "$env:RUNNER_TEMP/red.log")) { throw 'expected a failing assertion in the multiline parser test' }
          exit 0
      - name: Verify both Windows parser tests with the fix
        shell: pwsh
        run: |
          cargo test --locked -p victory-gpu --lib pipeline::tests::skip_hashes_ 2>&1 | Tee-Object "$env:RUNNER_TEMP/green.log"
          if ($LASTEXITCODE -ne 0 -or !(Select-String -Quiet -SimpleMatch '2 passed; 0 failed' "$env:RUNNER_TEMP/green.log")) { throw 'expected both parser tests to pass' }
