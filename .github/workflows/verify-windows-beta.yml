name: Verify beta-2 card patch and fetch on Windows WARP
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 395efe9b00640069e660e62da5f4f0608ea8928b
          persist-credentials: false
      - name: Run the checked-in card shader tests
        run: cargo test --locked -p victory-gpu --lib --features diagnostics indirect::tests::warp_card -- --test-threads=1
      - name: Require successful creation of a WARP test device
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/victory-gpu/src/indirect.rs")
          text = path.read_text(encoding="utf-8")
          a = "let Some(mut warp) = WarpHarness::new() else {" + chr(10) + "            return;" + chr(10) + "        };"
          for name in ["warp_card_patch_writes_the_masked_bytes_and_no_others", "warp_card_fetch_copies_flagged_pieces_to_their_slots"]:
              start = text.index("fn " + name + "()")
              offset = text.index(a, start, start + 400)
              text = text[:offset] + text[offset:].replace(a, 'let mut warp = WarpHarness::new().expect("native WARP is required for this verification");', 1)
          path.write_text(text, encoding="utf-8")
      - name: Repeat both readbacks on required WARP devices in fresh processes
        shell: pwsh
        run: |
          foreach ($repeat in 1,2) {
            cargo test --locked -p victory-gpu --lib --features diagnostics indirect::tests::warp_card -- --test-threads=1
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
