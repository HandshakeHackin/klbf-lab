name: Isolate the surviving Lab 51 indirect and descriptor tests
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  descriptors:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: HandshakeHackin/klbf-lab
          ref: 54168e0b89300dd58eb42309562b9f1cd38fac2e
          persist-credentials: false
      - name: Isolate the test target from five unrelated stale test bodies in this CI checkout
        run: |
          @'
          from pathlib import Path
          root = Path("crates/victory-gpu/src")
          for file, names in {
              "descriptor/host.rs": ["a_newer_view_of_other_memory_makes_the_older_stale", "a_texture_of_which_the_smaller_mips_are_there_ends_behind_them", "spans_say_whose_memory_a_view_is", "a_texture_sweep_finds_views_nothing_brings_up_to_date"],
              "pipeline/host.rs": ["a_pipeline_with_depth_bounds_is_made"],
          }.items():
              p = root / file
              text = p.read_text(encoding="utf-8")
              for name in names:
                  symbol = "    #[test]\n    fn " + name + "("
                  assert text.count(symbol) == 1, name
                  text = text.replace(symbol, "    #[cfg(any())]\n" + symbol)
              p.write_text(text, encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require the retained indirect tests to exercise WARP fixtures
        env:
          VICTORY_D3D12_WARP: '1'
        run: |
          @'
          from pathlib import Path
          import subprocess
          p = Path("crates/victory-gpu/src/indirect.rs")
          s = p.read_text(encoding="utf-8")
          names = ["warp_a_group_charges_its_records_in_lane_order", "host_list_budget_starts_empty_at_each_submission", "warp_window_executions_read_their_records_with_no_barrier_between", "host_list_window_executions_need_no_barrier_of_their_own", "host_list_window_check_finds_a_record_written_under_its_window"]
          for name in names:
              pos = s.index("    fn " + name + "(")
              end = s.index("\n    }", pos)
              part = s[pos:end]
              assert "return;" in part
              s = s[:pos] + part.replace("return;", 'panic!("fixture not available");') + s[end:]
          p.write_text(s, encoding="utf-8")
          for name in names:
              r = subprocess.run(["cargo", "test", "--locked", "-p", "victory-gpu", "--features", "diagnostics", "--lib", "indirect::tests::"+name, "--", "--exact", "--test-threads=1"], capture_output=True, text=True)
              print(r.stdout, r.stderr[-1200:], flush=True)
              assert r.returncode == 0 and "1 passed; 0 failed" in r.stdout, name
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require a real WARP device and live heaps in each descriptor test
        if: ${{ !cancelled() }}
        env:
          VICTORY_D3D12_WARP: '1'
        run: |
          @'
          from pathlib import Path
          import re
          p = Path("crates/victory-gpu/src/descriptor/host.rs")
          s = p.read_text(encoding="utf-8")
          names = re.findall(r"    fn (concurrent_\w+|mirror_release_acquire_later_and_forget_semantics)\(", s)
          assert len(names) == 5, names
          for name in names:
              start = s.index("    fn " + name + "(")
              end = s.index("\n    }", start)
              case = s[start:end]
              case, found = re.subn(r"(let Some\((?:host_gpu|heap)\) = (?:host\(\)|HostHeap::new\([^\n]+?\)) else \{\s*)return;", r'\1panic!("WARP fixture unavailable");', case)
              assert found == 2, (name, found)
              s = s[:start] + case + s[end:]
          p.write_text(s, encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($filter in @('descriptor::host::tests::concurrent_','mirror_release_acquire_later_and_forget_semantics')) {
            $output = cargo test --locked -p victory-gpu --features diagnostics --lib $filter -- --test-threads=1 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $output
            $count = if ($filter.StartsWith('descriptor')) { 4 } else { 1 }
            if ($code -ne 0 -or $output -notmatch "test result: ok. $count passed; 0 failed") { throw "Incomplete $filter run" }
          }
