name: Verify Wave32 shader output on WARP, alone and with PR 41
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  parity:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: 0948a4fd56d97548e0b746ae3c9b4bcbb881032e
          fetch-depth: 0
          persist-credentials: false
      - name: Check reviewed revision
        run: |
          if ((git rev-parse HEAD) -ne '0948a4fd56d97548e0b746ae3c9b4bcbb881032e') { throw 'Pull request revision changed' }
      - run: rustup toolchain install
      - name: Require the SDK validator in the test harness
        shell: python
        run: |
          from pathlib import Path
          p = Path("crates/victory-shader/src/emit/wave64_tests.rs")
          data = p.read_text(encoding="utf-8")
          optional = "if let Ok(mut v) = validator::Validator::load(validator::Validator::default_path().as_deref()) {"
          strict = '{ let mut v = validator::Validator::load(validator::Validator::default_path().as_deref()).expect("Windows SDK DXIL validator required");'
          start = data.index('fn run_wave32_lds_on_hardware(')
          before, target = data[:start], data[start:]
          assert target.count(optional) == 1
          p.write_text(before + target.replace(optional, strict), encoding="utf-8")
      - name: Validate computed outputs on the standalone PR
        env:
          VICTORY_WARP: "1"
          VICTORY_REQUIRE_HW_GPU: "1"
          VICTORY_D3D12_DEBUG: "1"
        run: cargo test --locked -p victory-shader --lib lds -- --nocapture --test-threads=1
      - name: Add the exact shader optimization PR
        shell: bash
        run: |
          set -euo pipefail
          git fetch https://github.com/PastiiJay/klbf-lab.git refs/pull/41/head
          git -c user.name=CI -c user.email=ci@localhost merge --no-edit ba88ab0607c7cc1b7fa83b3c6f3a4a9beb1093be
          test "$(git rev-parse 'HEAD^{tree}')" = 4e0694074c06b63a1f25c06e46efa45b5b5efd9f
      - name: Validate Wave32 outputs with the shader optimizer
        env:
          VICTORY_WARP: "1"
          VICTORY_REQUIRE_HW_GPU: "1"
          VICTORY_D3D12_DEBUG: "1"
        run: cargo test --locked -p victory-shader --lib lds -- --nocapture --test-threads=1
