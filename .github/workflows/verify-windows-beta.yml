name: Verify adapter-specific pipeline cache files
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  cache:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: 7d31a81ed4f35930b9a205ae620ea2942563ccec
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Verify names and migration of the legacy cache
        run: |
          cargo test --locked -p victory-gpu --lib adapter_keys_produce_distinct_filenames_for_hardware_and_software
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p victory-gpu --lib legacy_fallback_reads_hardware_cache_and_never_touches_it_on_warp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run the WARP child and verify cache isolation on disk
        shell: python
        run: |
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import os, re, subprocess
          with TemporaryDirectory() as temp:
              new = Path(temp) / "new"
              old = Path(temp) / "legacy"
              new.mkdir()
              old.mkdir()
              fixtures = {
                  old / "host-pipelines.bin": b"synthetic legacy fixture",
                  new / "host-pipelines-10de-2783-ra1-hw.bin": b"synthetic hardware fixture",
              }
              for path, data in fixtures.items():
                  path.write_bytes(data)
              env = dict(os.environ, VICTORY_TEST_LIB_WARP_DIR=str(new), VICTORY_TEST_LIB_WARP_LEGACY_DIR=str(old))
              cmd = ["cargo", "test", "--locked", "-p", "victory-gpu", "--lib", "pipeline::library::tests::warp_save_does_not_discard_hardware_pipeline_library", "--", "--exact", "--nocapture", "--test-threads=1"]
              proc = subprocess.run(cmd, env=env, capture_output=True, text=True)
              print(proc.stdout, proc.stderr)
              proc.check_returncode()
              name = re.search(r"WARP_FILE=(host-pipelines-[A-Za-z0-9-]+-sw[.]bin)", proc.stdout)
              assert name, "WARP cache save/reopen did not execute"
              for directory in (new, old):
                  size = (directory / name[1]).stat().st_size
                  assert size > 0
                  print(f"{name[1]} saved, {size} bytes")
              for path, data in fixtures.items():
                  assert path.read_bytes() == data
              print("Both synthetic hardware and legacy cache files retained their original contents.")
