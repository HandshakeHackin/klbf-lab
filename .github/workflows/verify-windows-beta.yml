name: Verify asset policy and CLI regression on Windows
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  asset-policy:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 4ad2343c9b530bb1bb9081943cf2933ce1a882cf
          persist-credentials: false
      - run: cargo xtask policy
      - run: cargo test --locked -p victory-shader -p xtask
  historical-cold-cache:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: d0ed1acded0e26b87fa3cdfa24c7114d886a7918
          path: before
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: c71c7d6bc627758ad858a736233cc2a4b14bd717
          path: after
          persist-credentials: false
      - name: Build the historical Windows CLI
        working-directory: before
        run: cargo build --locked -p victory
      - name: Verify the regression test catches the original defect
        shell: pwsh
        run: |
          $env:VICTORY_CONFIG = $null
          $log = & python after/tests/check_cold_cache.py before/target/debug/victory.exe 2>&1
          $code = $LASTEXITCODE
          $log
          if ($code -ne 1 -or ($log -join ' ') -notmatch 'FAIL: pre-build returned without creating cache/pipelines') {
            throw 'Expected the original CLI to fail specifically on the absent cache directory.'
          }
          exit 0
