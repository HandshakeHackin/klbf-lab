name: Check PR 72 alone and run its descriptor tests with PR 37
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  descriptors:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 54ca988330b6dcbceb3dd873afa43ef7c7674fbd
          fetch-depth: 0
          persist-credentials: false
      - name: Compile victory-gpu at the standalone PR head
        run: cargo check --locked -p victory-gpu --lib
      - name: Merge the independent indirect and depth test repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/HandshakeHackin/klbf-lab.git 3ecd80f610cf4954cc2377f328662e1fce600c0d
          git -c user.name=CI -c user.email=ci@localhost merge --no-commit FETCH_HEAD
          test "$(git hash-object crates/victory-gpu/src/descriptor/host.rs)" = 54eb49ab5969ec4dd48b1408d6377304ae27dfd3
      - name: Run the complete descriptor host test module
        run: cargo test --locked -p victory-gpu --lib descriptor::host::tests:: -- --nocapture --test-threads=1
