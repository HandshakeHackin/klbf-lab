name: Verify beta write-watch test with retained page history
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  journal:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 6f55eae05c4900b656ff5e723c7d685a3172ef3a
          fetch-depth: 2
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Exercise the original assertion with a retained page stamp
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path("crates/victory-gpu/src/watch.rs")
          subprocess.run(["git", "restore", "--source=HEAD^", "--", str(path)], check=True)
          source = path.read_text(encoding="utf-8")
          needle = '        let (_, before) = writes(start, end, false).expect("watched");'
          assert source.count(needle) == 1
          # Simulate an earlier user of this virtual address through the normal
          # write-watch path, so the kernel bit is reset but the journal remembers.
          seed = '        unsafe { (p as *mut u8).write(1) };\n        writes(start, end, false).expect("seed history");\n'
          path.write_text(source.replace(needle, seed + needle), encoding="utf-8")
          test = "watch::tests::written_pages_are_reported_to_every_asker"
          cmd = ["cargo", "test", "--locked", "-p", "victory-gpu", "--lib", test, "--", "--exact", "--test-threads=1"]
          old = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(old.stdout, flush=True)
          assert old.returncode and "assertion failed: before.is_empty()" in old.stdout, "Expected the original history assertion"
          subprocess.run(["git", "restore", "--", str(path)], check=True)
      - name: Run the unmodified candidate test and its watch suite
        shell: python
        run: |
          import subprocess
          for tests, exact in [("watch::tests::written_pages_are_reported_to_every_asker", ["--exact"]), ("watch::tests::", [])]:
              args = ["cargo", "test", "--locked", "-p", "victory-gpu", "--lib", tests, "--", *exact, "--test-threads=1"]
              result = subprocess.run(args, stdout=subprocess.PIPE, text=True)
              print(result.stdout, flush=True)
              result.check_returncode()
              assert "watch::tests::written_pages_are_reported_to_every_asker ... ok" in result.stdout
