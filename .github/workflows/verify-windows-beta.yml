name: Verify PR 23 staging residency and pending texture bytes
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  residency:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: cbeed1e65e2bbb468e5bd9cfd932f44963d498a5
          persist-credentials: false
      - name: Check residency, pending bytes, recreation and drop on WARP
        env:
          VICTORY_D3D12_WARP: '1'
        shell: pwsh
        run: |
          @'

          #[cfg(all(test, feature = "diagnostics"))]
          mod staging_residency_review {
              use super::*;
              use std::sync::atomic::Ordering::Relaxed;
              use victory_formats::texture::{Desc, Dimension, Layout, Swizzle};

              const BYTES: u64 = 256;

              fn sample(changed: u64, waiting: u64) -> Arc<Staging> {
                  let layout = Layout::new(&Desc {
                      dimension: Dimension::Tex2d, width: 1, height: 1, depth: 1,
                      mips: 1, element_bytes: 4, block: 1, samples: 1, swizzle: Swizzle::LINEAR,
                  }).unwrap();
                  STAGED[0].fetch_add(1, Relaxed);
                  STAGED[1].fetch_add(BYTES, Relaxed);
                  let s = Arc::new(Staging {
                      mem: Mutex::new(None), size: BYTES, changed: changed.into(),
                      footprints: vec![], rows: vec![], layout, mips: 1, bytes: BYTES,
                      memory: std::ptr::null(), last: Mutex::default(), dirty: false.into(),
                      uploaded: true.into(), used: crate::host::moment().into(), on_demand: true,
                      detiled: 1.into(), judged: Default::default(), waiting: waiting.into(),
                  });
                  let (_, mapped) = s.buffer().expect("a mapped WARP upload buffer");
                  // SAFETY: this fixture exclusively owns this live 256-byte mapping.
                  unsafe { (mapped as *mut u8).write_bytes(0x75, BYTES as usize) };
                  s
              }

              #[test]
              fn sweep_preserves_pending_bytes_and_counts_live_buffers_through_recreation() {
                  host().expect("WARP host");
                  let changed = crate::host::moment();
                  for _ in 0..32 {
                      crate::frame::wait(std::ptr::null(), 0, 0, std::ptr::null(), 2, std::ptr::null_mut());
                  }
                  std::thread::sleep(std::time::Duration::from_millis(2150));
                  assert!(crate::host::long_ago(changed, UNCHANGED_MS, UNCHANGED_FRAMES));
                  let base = memory();
                  let settled = sample(changed, 0);
                  let pending = sample(changed, changed.max(1));
                  {
                      let mut table = STAGING.lock().unwrap();
                      let map = table.get_or_insert_with(HashMap::new);
                      assert!(map.insert(1, settled).is_none());
                      assert!(map.insert(2, pending).is_none());
                  }
                  let before = memory();
                  assert_eq!(before, [base[0]+2, base[1]+2*BYTES, base[2]+2, base[3]+2, base[4]+2*BYTES]);
                  let start = lightened();
                  let keep = staging_keep();
                  let released = u64::from(!keep);
                  let_go_idle();
                  let after = memory();
                  assert_eq!(&before[..3], &after[..3]);
                  assert_eq!(after[3], before[3]-released);
                  assert_eq!(after[4], before[4]-released*BYTES);
                  let_go_idle();
                  assert_eq!(memory(), after, "second sweep must preserve the counts");
                  let (settled, pending) = {
                      let mut table = STAGING.lock().unwrap();
                      let map = table.as_mut().unwrap();
                      (map.remove(&1).unwrap(), map.remove(&2).unwrap())
                  };
                  assert_eq!(settled.mem.lock().unwrap().is_some(), keep);
                  assert!(pending.mem.lock().unwrap().is_some());
                  let (_, data) = pending.buffer().unwrap();
                  // SAFETY: pending still owns the live allocation and it has no GPU writers.
                  let bytes = unsafe { std::slice::from_raw_parts(data as *const u8, BYTES as usize) };
                  assert!(bytes.iter().all(|&byte| byte == 0x75));
                  settled.buffer().expect("settled buffer available on demand");
                  settled.buffer().expect("second lookup reuses the resident allocation");
                  let recreated = memory();
                  assert_eq!(&recreated[3..], &before[3..]);
                  let finish = lightened();
                  assert_eq!(finish, [start[0]+released,start[1]+released*BYTES,start[2]+released,start[3]+released*BYTES]);
                  drop((pending, settled));
                  assert_eq!(memory(), base, "all record and resident counts must return to baseline");
                  eprintln!("keep={keep} resident bytes {} -> {} -> {} -> {}; pending contents matched all {BYTES} bytes",
                      before[4]-base[4], after[4]-base[4], recreated[4]-base[4], memory()[4]-base[4]);
              }
          }
          '@ | Add-Content -Encoding utf8 crates/victory-gpu/src/texture.rs
          foreach ($keep in '0','1') {
              $env:VICTORY_STAGING_KEEP = $keep
              cargo test --locked -p victory-gpu --features diagnostics --lib sweep_preserves_pending_bytes_and_counts_live_buffers_through_recreation -- --nocapture
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
