name: Verify missing DXGI readings and real present-counter wrap
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  counts:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d18474523030d0bda09080b48dd52c3a197bead4
          persist-credentials: false
      - name: Run the frame-generation tests against the compiled GPU library
        run: cargo test --locked -p victory-gpu --lib ffx::tests:: -- --nocapture
      - name: Verify the same regression catches a missing count treated as zero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("crates/victory-gpu/src/ffx.rs")
          s = p.read_text()
          original = "let presented = presented?;"
          assert s.count(original) == 1
          p.write_text(s.replace(original, "let presented = presented.unwrap_or(0);"))
          PY
          if cargo test --locked -p victory-gpu --lib ffx::tests::present_rates_span_failed_queries_and_preserve_a_real_counter_wrap -- --exact --nocapture > "$RUNNER_TEMP/control.txt" 2>&1; then
            cat "$RUNNER_TEMP/control.txt"
            exit 1
          fi
          cat "$RUNNER_TEMP/control.txt"
          grep -F 'left: Some((1.0, 4294967292.0))' "$RUNNER_TEMP/control.txt"
