name: Verify PR 12 loop values on Windows WARP
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 4b384728cba3ef8343872bda793993385223b840
          fetch-depth: 3
          persist-credentials: false
      - name: Validate and dispatch the fixture on the parent and the pull request
        shell: bash
        run: |
          set -euo pipefail
          test_head=$(git rev-parse HEAD)
          git show --format= "$test_head" -- crates/victory-shader/src/emit > "$RUNNER_TEMP/fixture.patch"
          for version in 39cd1f4bd0d46139545a46affebe710f303fd4f4 7b916df6d0847c5f76daf412cef79fed65f21cb6; do
            git checkout --detach "$version"
            git apply "$RUNNER_TEMP/fixture.patch"
            for opts in 0 default; do
              if [[ "$opts" == default ]]; then unset VICTORY_SHADER_OPT; else export VICTORY_SHADER_OPT="$opts"; fi
              echo "Revision $version, shader optimization $opts"
              cargo test --locked -p victory-shader --lib two_loop_back_edges_preserve_both_phi_values_on_warp -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/result.log"
              grep -F "Both phi values matched on all 128 threads" "$RUNNER_TEMP/result.log"
            done
            git apply -R "$RUNNER_TEMP/fixture.patch"
          done
