name: Verify final shader input regression script
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cbb00fd84464e5ede6fbd8378cedc9b8b001a9e7
          persist-credentials: false
      - run: cargo build --locked -p victory
      - run: python tests/check_cold_cache.py target/debug/victory.exe
