name: Compare directly-indexed root signature support in the candidate
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  root-signature:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: 338f7c527b5522f0bf0fa1cc1cb2047b43fef181
          persist-credentials: false
      - name: Instrument the existing root-signature path before the shader-model gate
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("crates/victory-shader/src/emit/host.rs")
          s = p.read_text(encoding="utf-8")
          anchor = 'let mut sm = D3D12_FEATURE_DATA_SHADER_MODEL {'
          assert s.count(anchor) == 1
          s = s.replace(anchor, '''let probe = Self { device: device.clone() };
                      eprintln!("PROBE starting flags=0xc01");
                      match probe.root_signature_for(&[]) {
                          Ok(_) => eprintln!("PROBE created root signature"),
                          Err(error) => eprintln!("PROBE root signature error: {error}"),
                      }
                      ''' + anchor)
          anchor = 'let blob: ID3DBlob = blob.ok_or("no root signature blob")?;'
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + '\n            eprintln!("PROBE serialized flags=0xc01");')
          anchor = 'if sm.HighestShaderModel.0 < D3D_SHADER_MODEL_6_6.0 {'
          assert s.count(anchor) == 1
          s = s.replace(anchor, 'eprintln!("PROBE shader model {:#x}", sm.HighestShaderModel.0);\n            ' + anchor)
          p.write_text(s, encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare the packaged runtime with the inbox control using the same probe
        env:
          VICTORY_WARP: '1'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $root = Join-Path $env:RUNNER_TEMP 'empty-scan'
          New-Item -ItemType Directory -Path $root | Out-Null
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.Direct3D.D3D12/1.614.1 -OutFile d3d12.zip
          Expand-Archive d3d12.zip d3d12pkg -Force
          foreach ($mode in @('packaged','inbox')) {
            if ($mode -eq 'inbox') {
              [IO.File]::WriteAllText((Resolve-Path apps/victory/build.rs), 'fn main() {}')
              Move-Item target/release/D3D12 (Join-Path $env:RUNNER_TEMP 'sdk-control')
            }
            cargo build --release --locked -p victory
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($mode -eq 'packaged') {
              New-Item -ItemType Directory -Path target/release/D3D12 -Force | Out-Null
              Copy-Item d3d12pkg/build/native/bin/x64/D3D12Core.dll target/release/D3D12/
            }
            $out = & ./target/release/victory.exe translate --pipelines $root 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host "PROFILE=$mode CLI_EXIT=$code Windows=$([Environment]::OSVersion.Version)"
            Write-Host $out
            if ($out -notmatch 'PROBE starting flags=0xc01' -or $out -notmatch 'PROBE shader model') {
              throw "Probe did not observe the root-signature test on $mode"
            }
            if ($mode -eq 'packaged' -and $out -notmatch 'PROBE serialized flags=0xc01') {
              throw 'The packaged runtime did not serialize the target root signature.'
            }
          }
          exit 0
