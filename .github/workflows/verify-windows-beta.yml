name: Verify native Windows profiler for PR 53
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: d006c10fe0159727c1fbd76455ce6ad9ecf4293b
          persist-credentials: false
      - name: Fetch the comparison revisions
        run: |
          git fetch --no-tags origin refs/pull/53/head
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((git rev-parse FETCH_HEAD) -ne 'd973b9d2143ccaf4e4012f5268982c2a321f7024') { throw 'Review head changed' }
          git restore --source=FETCH_HEAD -- crates/victory-gpu/src/profile/tests.rs
      - name: Build an integration target for the two unchanged profiler tests
        shell: python
        run: |
          from pathlib import Path
          crate = Path("crates/victory-gpu")
          with (crate / "Cargo.toml").open("a", encoding="utf-8") as manifest:
              manifest.write('\n[[test]]\nname = "profile_handoff"\npath = "src/profile_handoff.rs"\n')
          (crate / "src/profile_handoff.rs").write_text("#![allow(dead_code)]\nmod profile;\n", encoding="utf-8")
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Verify Windows supplies the native cycle counter
        shell: python
        run: |
          from ctypes import WinDLL, POINTER, byref, c_int, c_ulonglong, c_void_p
          api = WinDLL("kernel32", use_last_error=True)
          api.GetCurrentThread.restype = c_void_p
          api.QueryThreadCycleTime.argtypes = [c_void_p, POINTER(c_ulonglong)]
          api.QueryThreadCycleTime.restype = c_int
          value = c_ulonglong()
          assert api.QueryThreadCycleTime(api.GetCurrentThread(), byref(value)) and value.value
          print(f"Native cycle counter available ({value.value} cycles)")
      - name: Exercise the same tests before and after PR 53
        shell: python
        run: |
          import subprocess
          gpu = "crates/victory-gpu/src/profile.rs"
          # This integration target uses the unmodified profiler and skips unrelated descriptor unit tests.
          # Both revisions run the same profile tests from PR 53.
          for revision in ("baseline", "candidate"):
              if revision == "candidate":
                  subprocess.run(["git", "restore", "--source=d973b9d2143ccaf4e4012f5268982c2a321f7024", "--", gpu], check=True)
              for case in ("a_blocked_thread_is_sampled_in_a_kernel_wait", "time_goes_to_the_function_that_spent_it"):
                  name = "profile::tests::" + case
                  print(f"Testing {revision} {name}", flush=True)
                  command = ["cargo", "test", "--locked", "-p", "victory-gpu", "--features", "diagnostics", "--test", "profile_handoff", name, "--", "--exact", "--test-threads=1"]
                  result = subprocess.run(command, stdout=subprocess.PIPE, text=True)
                  print(result.stdout, flush=True)
                  result.check_returncode()
                  if "1 passed; 0 failed" not in result.stdout:
                      raise RuntimeError(f"Expected one executed test for {name}")
