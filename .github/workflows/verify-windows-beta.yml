name: Verify pipeline refusal diagnostics on Windows
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d8d59d4816f4e1beb14ee0c0dd50372cbb15e4dc
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Verify the diagnostic reports its refusal before the change
        shell: pwsh
        run: |
          $file = 'crates/victory-gpu/src/pipeline/make.rs'
          $source = Get-Content -Raw $file
          $old = 'return Some((*reason).to_owned());'
          if (-not $source.Contains($old)) { throw 'expected diagnostic branch missing' }
          Set-Content -NoNewline $file $source.Replace($old, 'let _ = reason;')
          cargo test -p victory-gpu --locked --features diagnostics --lib pipeline::make::tests::first_use_is_made_by_a_worker -- --exact *> negative.log
          $code = $LASTEXITCODE
          Get-Content negative.log | Select-Object -Last 24
          git restore -- $file
          if ($code -eq 0 -or -not (Select-String -Path negative.log -SimpleMatch 'Some("refused []")')) { throw 'expected prior aggregate label was not detected' }
          exit 0
      - name: Check the recorded reason in the worker tests
        run: cargo test -p victory-gpu --locked --features diagnostics --lib pipeline::make::tests::
      - name: Check default-feature worker tests
        run: cargo test -p victory-gpu --locked --lib pipeline::make::tests::
