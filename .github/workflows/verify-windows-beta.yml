name: Verify moved shader tests and isolate physical GPU requirement
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  changed-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 4ad2343c9b530bb1bb9081943cf2933ce1a882cf
          persist-credentials: false
      - run: cargo xtask policy
      - run: cargo test --locked -p xtask
      - run: cargo test --locked -p victory-shader --lib 'emit::lower::tests::'
  unchanged-beta-control:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: c71c7d6bc627758ad858a736233cc2a4b14bd717
          persist-credentials: false
      - name: Check the hardware-plus-WARP assertion on the original beta
        shell: pwsh
        run: |
          cargo test --locked -p victory-shader --lib glc_heap_uav_loads_stores_and_atomics_execute_on_gpu -- --nocapture 2>&1 | Tee-Object -Variable result
          $status = $LASTEXITCODE
          $text = $result | Out-String
          if ($status -ne 101 -or $text -notmatch 'no SM 6.6 hardware device; skipped' -or $text -notmatch 'expected both hardware GPU and WARP to run, got 1') {
            throw 'The baseline result differs from the software-only runner result under investigation.'
          }
          exit 0
