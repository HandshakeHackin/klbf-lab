name: Verify adapter-specific pipeline cache files
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  cache:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: 7d31a81ed4f35930b9a205ae620ea2942563ccec
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Verify names and migration of the legacy cache
        run: |
          cargo test --locked -p victory-gpu --lib adapter_keys_produce_distinct_filenames_for_hardware_and_software
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p victory-gpu --lib legacy_fallback_reads_hardware_cache_and_never_touches_it_on_warp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run the WARP child and verify cache isolation on disk
        run: |
          $env:VICTORY_TEST_LIB_WARP_DIR = Join-Path $env:RUNNER_TEMP new-cache
          $env:VICTORY_TEST_LIB_WARP_LEGACY_DIR = Join-Path $env:RUNNER_TEMP old-cache
          New-Item $env:VICTORY_TEST_LIB_WARP_DIR,$env:VICTORY_TEST_LIB_WARP_LEGACY_DIR -ItemType Directory | Out-Null
          $legacy = Join-Path $env:VICTORY_TEST_LIB_WARP_LEGACY_DIR 'host-pipelines.bin'
          $hardware = Join-Path $env:VICTORY_TEST_LIB_WARP_DIR 'host-pipelines-10de-2783-ra1-hw.bin'
          Set-Content -NoNewline $legacy 'synthetic legacy fixture'
          Set-Content -NoNewline $hardware 'synthetic hardware fixture'
          $before = (Get-FileHash $legacy).Hash,(Get-FileHash $hardware).Hash
          cargo test --locked -p victory-gpu --lib pipeline::library::tests::warp_save_does_not_discard_hardware_pipeline_library -- --exact --nocapture --test-threads=1 *> cache-test.log
          $code = $LASTEXITCODE
          Get-Content cache-test.log | Select-Object -Last 24
          if ($code) { exit $code }
          $result = [regex]::Match((Get-Content -Raw cache-test.log),'WARP_FILE=(host-pipelines-[A-Za-z0-9-]+-sw\.bin)')
          if (-not $result.Success) { throw 'WARP cache save/reopen did not execute' }
          foreach ($dir in @($env:VICTORY_TEST_LIB_WARP_DIR,$env:VICTORY_TEST_LIB_WARP_LEGACY_DIR)) {
            $f = Get-Item (Join-Path $dir $result.Groups[1].Value)
            if ($f.Length -le 0) { throw 'Expected nonempty software pipeline cache' }
            Write-Host "$($f.Name) saved, $($f.Length) bytes"
          }
          if ($before[0] -ne (Get-FileHash $legacy).Hash -or $before[1] -ne (Get-FileHash $hardware).Hash) { throw 'Fixture was modified' }
          Write-Host 'Both synthetic hardware and legacy cache hashes were preserved.'
