name: Verify merged beta changes on Windows
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: 45546f9363ff9531b87de731bc320b18e09e09eb
          persist-credentials: false
      - run: cargo test --locked -p victory --bin victory translate_
      - run: cargo build --locked -p victory
      - run: python tests/check_cold_cache.py target/debug/victory.exe
      - name: Check zero-second warm-up
        shell: pwsh
        run: |
          $inputs = Join-Path $env:RUNNER_TEMP 'empty-inputs'
          New-Item -ItemType Directory -Path $inputs | Out-Null
          $env:VICTORY_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'warm-cache'
          $env:VICTORY_WARM_SECONDS = '0'
          $output = & .\target\debug\victory.exe translate --warm all $inputs
          $output
          if ($LASTEXITCODE -ne 0 -or ($output -join ' ') -notmatch 'stopped at the time limit') {
            throw 'Expected the warm-up to stop at its time limit.'
          }
