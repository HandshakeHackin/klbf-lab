name: Test PR 67 on native Windows
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          repository: PastiiJay/klbf-lab
          ref: 7d8286d7841184d3015ede82b6fcdc0ff1db103b
          fetch-depth: 2
          persist-credentials: false
      - name: Compile the exact PR source with diagnostics
        run: cargo check --locked -p victory-gpu --features diagnostics --lib
      - name: Apply PR 37's existing test-target repairs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=5 https://github.com/HandshakeHackin/klbf-lab.git 8aea65cc7325507b2bceafca58bd21f6253cb4bc
          git diff d006c10fe0159727c1fbd76455ce6ad9ecf4293b 8aea65cc7325507b2bceafca58bd21f6253cb4bc | git apply
          git diff --exit-code HEAD -- crates/victory-gpu/src/watch.rs crates/victory-gpu/src/drvwatch.rs
      - name: Isolate the unrelated descriptor unit module with stale APIs
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/victory-gpu/src/descriptor/host.rs')
          s = p.read_text()
          marker = '#[cfg(test)]\nmod tests {'
          assert s.count(marker) == 1
          p.write_text(s.replace(marker, '#[cfg(any())]\nmod tests {'))
      - name: Run all write-watch tests and the Windows event subscription test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p victory-gpu --features diagnostics --lib 'watch::tests::' -- --test-threads=1 --skip 'drvwatch::' --nocapture 2>&1 | tee "$RUNNER_TEMP/watch.txt"
          grep -F '13 passed; 0 failed' "$RUNNER_TEMP/watch.txt"
          cargo test --locked -p victory-gpu --features diagnostics --lib 'drvwatch::tests::the_system_takes_the_subscription' -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/event.txt"
          grep -F '1 passed; 0 failed' "$RUNNER_TEMP/event.txt"
