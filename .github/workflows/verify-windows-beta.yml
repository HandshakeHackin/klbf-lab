name: Check consecutive LDS reads on Windows
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          ref: b08f25e206d063a1a61a1c84ea2745fd021dae34
          fetch-depth: 3
          persist-credentials: false
      - name: Require the SDK validator and disassembler, save shader entry points
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/victory-shader/src/emit/wave64_tests.rs')
          text = p.read_text()
          marker = 'fn split_lds_adjacent_reads_share_only_the_middle_meeting()'
          prefix, case = text.split(marker)
          a = 'if let Ok(mut v) = validator::Validator::load(validator::Validator::default_path().as_deref()) {'
          assert case.count(a) == 1
          case = case.replace(a, '{ let mut v = validator::Validator::load(validator::Validator::default_path().as_deref()).expect("SDK validator required");')
          a = 'if let Some(dump) = super::tests::dump_dxil(&shader.dxil) {'
          assert case.count(a) == 1
          case = case.replace(a, '''{ let dump = super::tests::dump_dxil(&shader.dxil).expect("SDK dxc required");
                      let ir = dump.split("define void @main()").nth(1).expect("entry point").split("\\n}").next().unwrap();
                      assert!(!ir.contains("dx.op.wave"), "fixture must be independent of wave intrinsics");
                      std::fs::write(format!("entry-{}-{label}-{passes}.txt", std::env::var("CASE").unwrap()), ir).unwrap();''')
          p.write_text(prefix + marker + case)
      - name: Validate and inspect the exact Wave32 shaders
        shell: bash
        env:
          CASE: wave32
        run: cargo test --locked -p victory-shader --lib split_lds_adjacent_reads_share_only_the_middle_meeting -- --nocapture
      - name: Omit the wave-width declaration only for the WARP control
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/victory-shader/src/emit/lower.rs')
          s = p.read_text()
          old = 'if console_lanes || one_wave && s.lds_dwords > 0 {'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'if console_lanes {'))
      - name: Require WARP readback at all 192 dwords for each mask
        shell: bash
        env:
          CASE: warp
          VICTORY_WARP: '1'
          VICTORY_REQUIRE_HW_GPU: '1'
        run: cargo test --locked -p victory-shader --lib split_lds_adjacent_reads_share_only_the_middle_meeting -- --nocapture
      - name: Check that each WARP control ran the identical entry-point instructions
        shell: python
        run: |
          from pathlib import Path
          from itertools import product
          crate = Path('crates/victory-shader')
          for label, mask in product(('adjacent','separated'), (0,128)):
              a = (crate/f'entry-wave32-{label}-{mask}.txt').read_text()
              b = (crate/f'entry-warp-{label}-{mask}.txt').read_text()
              assert a == b, f'entry instructions differ for {label} mask {mask}'
              print(f'{label} mask {mask}: {len(a.splitlines())} identical entry-point lines')
      - name: Compare both masks on the unmodified PR 41 lowering
        shell: bash
        env:
          CASE: original
        run: |
          git checkout ba88ab0607c7cc1b7fa83b3c6f3a4a9beb1093be -- crates/victory-shader/src/emit/lower.rs
          sed -i 's/("adjacent", words.as_slice(), "BWBRRBWBR")/("adjacent", words.as_slice(), "BWBRBRBWBR")/' crates/victory-shader/src/emit/wave64_tests.rs
          cargo test --locked -p victory-shader --lib split_lds_adjacent_reads_share_only_the_middle_meeting -- --nocapture
      - name: Lint the published shader, then run all library tests with the upstream WARP runner fix
        shell: bash
        run: |
          git restore --source=HEAD --staged --worktree -- crates/victory-shader/src/emit/lower.rs crates/victory-shader/src/emit/wave64_tests.rs
          cargo clippy --locked -p victory-shader --all-targets -- -D warnings
          git fetch --no-tags --depth=2 https://github.com/PastiiJay/klbf-lab.git 448b737fa8f4e669c3a9cede26c08a04d4cacd96
          git show FETCH_HEAD -- crates/victory-shader/src/emit/valu_tests.rs | git apply
          cargo test --locked -p victory-shader --lib
