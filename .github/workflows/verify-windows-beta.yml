name: Verify PR 41 with the queued beta changes on Windows
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a9e0c53c7f6c1741f8f4330013e5bed8ea1d2ef8
          fetch-depth: 0
          persist-credentials: false
      - name: Combine the exact PR and queued fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch https://github.com/PastiiJay/klbf-lab.git refs/pull/41/head 448b737fa8f4e669c3a9cede26c08a04d4cacd96
          git -c user.name=CI -c user.email=ci@localhost merge --no-edit ba88ab0607c7cc1b7fa83b3c6f3a4a9beb1093be
          test "$(git rev-parse 'HEAD^{tree}')" = 516e533e3d23bc7c06bdd2874669a91819ba40dd
          git cherry-pick --no-commit 448b737fa8f4e669c3a9cede26c08a04d4cacd96
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo xtask policy
      - run: cargo test --workspace --locked
