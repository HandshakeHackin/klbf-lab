name: Verify bounds-only pipelines on Windows
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  gpu-tests:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d91ab6e14e0c37bfd511339f6bc7ecf94848bf7f
          persist-credentials: false
      - name: Run all default GPU library tests at the patch head
        run: cargo test --locked -p victory-gpu --lib
      - name: Confirm both pixel reads on forced WARP
        env:
          VICTORY_D3D12_WARP: '1'
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("crates/victory-gpu/src/pipeline/host.rs")
          s = p.read_text(encoding="utf-8")
          marker = 'assert_eq!(run_draw(0.6, 1.0), 0,'
          assert s.count(marker) == 1
          s = s.replace(marker, 'let outside = run_draw(0.6, 1.0); eprintln!("WARP outside={outside}"); assert_eq!(outside, 0,')
          marker = 'assert_eq!(run_draw(0.4, 0.6), 255,'
          assert s.count(marker) == 1
          s = s.replace(marker, 'let inside = run_draw(0.4, 0.6); eprintln!("WARP inside={inside}"); assert_eq!(inside, 255,')
          p.write_text(s, encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Could not add the test-only pixel printouts' }
          cargo test --locked -p victory-gpu --lib --features diagnostics depth_bounds_pipeline_loads_and_filters_draws -- --nocapture 2>&1 | Tee-Object -Variable result
          $code = $LASTEXITCODE
          $log = $result | Out-String
          if ($code -ne 0 -or $log -notmatch 'WARP outside=0' -or $log -notmatch 'WARP inside=255') {
            throw 'Expected both measured WARP pixels; an early return does not verify the fix.'
          }
