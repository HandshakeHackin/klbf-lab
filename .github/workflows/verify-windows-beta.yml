name: Verify PR 64 with the queued beta CI fixes
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  integrated:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 827b9badb3f7bb53b668c2ba26fa4df2665ce5a9
          fetch-depth: 0
          persist-credentials: false
      - name: Integrate the existing strict-lint, asset policy, depth, and test isolation patches
        shell: pwsh
        run: |
          git config user.name "Integration check"
          git config user.email "ci@localhost"
          foreach ($head in @('6190ae2353cdc9ccd62b952a4b86ec9d9aa27f44','4ad2343c9b530bb1bb9081943cf2933ce1a882cf','a375d01159cd71eb5d128c8838a1f0f6778d6f75','6f55eae05c4900b656ff5e723c7d685a3172ef3a')) {
            git fetch --no-tags https://github.com/HandshakeHackin/klbf-lab.git $head
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git merge --no-edit --no-ff $head
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          git rev-parse 'HEAD^{tree}'
      - name: Strict workspace Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Strict workspace Clippy with diagnostics
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Workspace tests on WARP
        env:
          VICTORY_D3D12_WARP: '1'
        run: cargo test --workspace --locked -- --test-threads=1
