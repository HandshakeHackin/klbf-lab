name: Verify replay identity on actual benchmark JSON
on:
  push:
    branches: [verify-windows-beta-20261125]
permissions:
  contents: read
jobs:
  replay:
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: parent
            revision: d05ee764cc93c0e2c42c2737e8a3604c00be0b6d
          - version: patched
            revision: f1a4267de125a80acabef33bdc5e915860cca219
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - name: Run the existing Python benchmark suite
        run: python -X utf8 -m unittest tools/test_bench_loop.py
      - name: Add an input source and one synthetic present for the test
        shell: python
        run: |
          from pathlib import Path
          from sys import argv
          root=Path.cwd()
          p=root/'crates/victory-hle/src/modules/gameinput_script.rs'
          s=p.read_text()
          marker='    static TEST_WFRAME: AtomicU64 = AtomicU64::new(0);'
          assert s.count(marker)==1
          s=s.replace(marker,'''    #[test]
              fn write_replay_probe() {
                  let source = MockSource(Arc::new(Mutex::new(MockHost::default())));
                  let _wrapped = wrap(Box::new(source));
                  victory_gpu::bench::emit_synthetic_frame_for_probe();
              }

          '''+marker)
          p.write_text(s)
          p=root/'crates/victory-gpu/src/bench.rs'
          with p.open('a') as f:f.write('\npub fn emit_synthetic_frame_for_probe() { on_present(501, false); }\n')
      - name: Check invalid and valid replay identity in fresh processes
        shell: pwsh
        env:
          VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VICTORY_BENCH_WARMUP = '0'
          foreach ($kind in 'invalid','valid') {
            $env:VICTORY_INPUT_REPLAY = Join-Path $env:RUNNER_TEMP "$kind-route.jsonl"
            $env:VICTORY_BENCH_OUT = Join-Path $env:RUNNER_TEMP "$kind-benchmark.json"
            $trace = if ($kind -eq 'valid') { '{"from":1,"to":2,"ly":1.0}' } else { 'unavailable route' }
            [IO.File]::WriteAllText($env:VICTORY_INPUT_REPLAY, $trace)
            cargo test --locked -p victory-hle --lib modules::gameinput_script::tests::write_replay_probe -- --exact
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $report = Get-Content $env:VICTORY_BENCH_OUT -Raw | ConvertFrom-Json
            if ($report.world_frames -ne 1) { throw 'Expected one measured frame in report' }
            $hash = $report.input_script_sha256
            Write-Output "$env:VERSION $kind frames=$($report.world_frames) digest=$hash"
            if ($kind -eq 'invalid' -and $env:VERSION -eq 'patched') {
              if ($null -ne $hash) { throw 'Inactive route was reported as loaded' }
            } elseif ($hash -notmatch '^[a-f0-9]{64}$') {
              throw 'Expected the original or positive-control digest'
            }
          }
